<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strong Password Generator</title>
<!--
  COS738 Cyber Security - Strong Password Generator (HTML / JavaScript translation)
  University of the Western Cape (UWC)
  Lecturer: J. M. Blackledge
  Student: Anako Njikenjike (Student Number: 4024329)

  Translation of the Python program (password_gen.py) into one HTML file.
  Turns a memorable (weak) password into a strong, reproducible password.
  Same memorable password + same length -> always the same strong password.
  It gives exactly the same output as the Python program.

  Method: PBKDF2-HMAC-SHA256 (200,000 iterations, built-in Web Crypto API) derives
  bytes from the memorable password; the bytes are mapped onto a character set,
  one character of each category is forced in, and the result is shuffled.
  Everything runs in the browser: nothing is sent anywhere.
-->
<style>
  body { font-family: Arial, Helvetica, sans-serif; background: #f2f4f8; margin: 0; padding: 24px 16px; color: #1f2933; }
  .card { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 10px; padding: 24px 28px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  h1 { font-size: 22px; text-align: center; margin: 0 0 18px; }
  label { display: block; font-weight: bold; margin: 14px 0 4px; }
  input[type=password], input[type=text], input[type=number] { width: 100%; box-sizing: border-box; padding: 9px 10px; font-size: 15px; border: 1px solid #9aa5b1; border-radius: 6px; }
  #output { font-family: Consolas, Menlo, monospace; font-weight: bold; background: #f7f9fb; }
  .check { display: flex; align-items: center; gap: 6px; font-weight: normal; margin: 6px 0 0; font-size: 14px; }
  button { padding: 9px 16px; font-size: 14px; border: 1px solid #3b5998; background: #3b5998; color: #fff; border-radius: 6px; cursor: pointer; }
  button.secondary { background: #fff; color: #3b5998; }
  button:disabled { opacity: .6; cursor: wait; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  #generate { width: 100%; margin-top: 18px; padding: 11px; font-size: 15px; font-weight: bold; }
  #message { min-height: 22px; margin-top: 14px; font-size: 14px; }
  .error { color: #b3261e; } .ok { color: #1b6e3c; }
  footer { max-width: 560px; margin: 14px auto 0; font-size: 12px; color: #52606d; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <h1>Strong Password Generator</h1>

  <!-- Input 1: memorable weak password -->
  <label for="memorable">Memorable Weak Password:</label>
  <input type="password" id="memorable" autocomplete="off" spellcheck="false">
  <label class="check"><input type="checkbox" id="showMemorable"> Show memorable password</label>

  <!-- Input 2: output length -->
  <label for="length">Desired Password Length (min 8):</label>
  <input type="number" id="length" value="24" step="1">

  <button id="generate">Generate Strong Password</button>

  <!-- Output field (read-only) -->
  <label for="output">Generated Strong Password:</label>
  <input type="text" id="output" readonly>

  <label class="check"><input type="checkbox" id="includeMemorable"> Include memorable password in saved file</label>

  <div class="row">
    <button id="copy" class="secondary">Copy to Clipboard</button>
    <button id="save" class="secondary">Save Password to File</button>
  </div>

  <div id="message" role="status" aria-live="polite"></div>
</div>


<script>
// ---------------- Settings  ----------------
const UPPER = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const LOWER = "abcdefghijklmnopqrstuvwxyz";
const DIGITS = "0123456789";
const SYMBOLS = "!@#$%^&*()-_=+[]{};:,.<>/?";    // no space character
const CHARSET = UPPER + LOWER + DIGITS + SYMBOLS;  // 88 characters
const SALT = new TextEncoder().encode("COS738-StrongPasswordGenerator-UWC-v1");  // fixed salt (keeps output reproducible)
const ITERATIONS = 200000;                          // slows down brute-force guessing
const MIN_LENGTH = 8;

// ---------------- Core logic ----------------

// Step 1: derive (2 * length + 8) pseudo-random bytes from the memorable password.
// Bytes needed: length (mapping) + 4 (forcing) + length - 1 (shuffling).
async function deriveBytes(memorable, length) {
  if (!window.crypto || !window.crypto.subtle) {
    throw new Error("This browser does not support the Web Crypto API (needed for PBKDF2). Use a current version of Chrome, Edge, Firefox or Safari.");
  }
  const keyMaterial = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(memorable), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", hash: "SHA-256", salt: SALT, iterations: ITERATIONS },
    keyMaterial, (length * 2 + 8) * 8);
  return new Uint8Array(bits);
}

// Steps 2-4: turn the derived bytes into the password (pure function, no crypto).
function buildPassword(bytes, length) {
  // Step 2: map the first 'length' bytes onto the character set
  const pw = [];
  for (let i = 0; i < length; i++) {
    pw.push(CHARSET[bytes[i] % CHARSET.length]);
  }

  // Step 3: force one character from each category into the first four slots
  // (guarantees all four categories are present and none is overwritten)
  const categories = [UPPER, LOWER, DIGITS, SYMBOLS];
  for (let j = 0; j < 4; j++) {
    pw[j] = categories[j][bytes[length + j] % categories[j].length];
  }

  // Step 4: deterministic Fisher-Yates shuffle using the remaining bytes,
  // so the forced characters do not always sit at the start
  for (let i = length - 1; i > 0; i--) {
    const j = bytes[length + 4 + (length - 1 - i)] % (i + 1);
    const tmp = pw[i]; pw[i] = pw[j]; pw[j] = tmp;
  }
  return pw.join("");
}

// Validate the inputs, then derive and build the strong password.
async function deriveStrongPassword(memorable, length) {
  if (!memorable) throw new Error("Memorable password cannot be empty.");
  if (length < MIN_LENGTH) throw new Error("Desired password length must be at least 8 characters.");
  const bytes = await deriveBytes(memorable, length);
  return buildPassword(bytes, length);
}

// ---------------- GUI helpers ----------------
const memorableBox = document.getElementById("memorable");
const lengthBox = document.getElementById("length");
const outputBox = document.getElementById("output");
const messageBox = document.getElementById("message");
const generateBtn = document.getElementById("generate");

// Show a message under the form (isError = red, otherwise green)
function showMessage(text, isError) {
  messageBox.textContent = text;
  messageBox.className = isError ? "error" : "ok";
}

// Show or hide the memorable password
document.getElementById("showMemorable").addEventListener("change", function (e) {
  memorableBox.type = e.target.checked ? "text" : "password";
});

// Generate button: read inputs, validate, derive, display
async function onGenerate() {
  showMessage("", false);
  const memorable = memorableBox.value.trim();
  const lengthText = lengthBox.value.trim();

  if (!memorable) { showMessage("Please enter a memorable password.", true); return; }
  if (!/^-?\d+$/.test(lengthText)) { showMessage("Length must be a whole number.", true); return; }

  generateBtn.disabled = true;                 // avoid double clicks while PBKDF2 runs
  try {
    outputBox.value = await deriveStrongPassword(memorable, parseInt(lengthText, 10));
  } catch (err) {
    outputBox.value = "";
    showMessage(err.message || "An unexpected error occurred.", true);
  }
  generateBtn.disabled = false;
}

// Copy button: copy the password to the clipboard
async function onCopy() {
  if (!outputBox.value) { showMessage("No password to copy. Please generate a password first.", true); return; }
  try {
    await navigator.clipboard.writeText(outputBox.value);
  } catch (err) {                              // fallback for browsers that block the clipboard API
    outputBox.select();
    document.execCommand("copy");
  }
  showMessage("Password copied to clipboard.", false);
}

// Save button: download the password as a text file
function onSave() {
  if (!outputBox.value) { showMessage("No password to save. Please generate a password first.", true); return; }
  let text = "";
  if (document.getElementById("includeMemorable").checked) {
    text += "Memorable Weak Password: " + memorableBox.value.trim() + "\n";
  }
  text += "Generated Strong Password: " + outputBox.value + "\n";
  text += "Password Length: " + outputBox.value.length + " characters\n";

  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([text], { type: "text/plain;charset=utf-8" }));
  link.download = "strong_password.txt";
  link.click();
  URL.revokeObjectURL(link.href);
  showMessage("Password saved to strong_password.txt (check your Downloads folder).", false);
}

generateBtn.addEventListener("click", onGenerate);
document.getElementById("copy").addEventListener("click", onCopy);
document.getElementById("save").addEventListener("click", onSave);
</script>
</body>
</html>
